[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-platform-backend"
version = "1.0.0"
description = "多智能体内容运营创作平台 - 后端服务"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=0.37.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "SQLAlchemy>=2.0.25",
    "alembic>=1.13.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.19.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "openai>=1.10.0",
    "redis>=5.0.0",
    "APScheduler>=3.10.0",
    "PyJWT>=2.8.0",
    "pycryptodome>=3.20.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "qrcode>=7.4.0",
    "Markdown>=3.5.0",
    "jieba>=0.42.1",
    "ulid-py>=1.1.0",
    "watchfiles>=0.21.0",
    "playwright>=1.40.0",
    "scrapling>=0.2.0",
    "edge-tts>=6.1.0",
    "dashscope>=1.20.0",
    "lark-oapi>=1.4.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
media = [
    "av>=12.0.0",
    "opencv-python>=4.8.0",
    "imageio-ffmpeg>=0.5.0",
    "yt-dlp>=2024.1.0",
    "zhconv>=1.4.0",
    "torch>=2.0.0",
    "faster-whisper>=1.0.0",
]
transcribe = [
    "openai-whisper>=20231117",
    "stable-ts>=2.15.0",
]
providers = [
    "anthropic>=0.40.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-community>=0.2.0",
]
nlp = [
    "snownlp>=0.12.3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "capabilities*", "capability_service*", "scripts*"]
exclude = ["tests*", "alembic*", "bench*", "docs*", "data*", "logs*", "outputs*", "uploads*", "models*", "plugins*", "scenes*", "config*", "skills*", "tools*", "storage_states*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | alembic/versions
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "alembic/",
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"
markers = [
    "integration: real network calls (skip in CI without keys)",
    "slow: slow tests (Playwright, long waits)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".tox",
    ".venv",
    "alembic/versions",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]