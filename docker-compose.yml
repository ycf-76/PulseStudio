# PulseStudio 一键启动（Docker Compose）
# 前端: http://localhost:8080  后端 API: 经 nginx 代理 /api
services:
  backend:
    image: ghcr.io/ycf-76/pulsestudio-backend:latest
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # 生产建议换 MySQL/PostgreSQL：mysql+aiomysql://user:pass@host:3306/db
      DATABASE_URL: "sqlite+aiosqlite:////app/data/xhs_agent.db"
      UPLOAD_DIR: "/app/uploads"
      # 平台产物根目录（卡片图/视频等）
      MY_WORKS_OUTPUT_ROOT: "/app/outputs"
      # 在这里或 .env 配置模型厂商 Key
      # DEEPSEEK_API_KEY: ""
    volumes:
      - ./docker-data/db:/app/data
      - ./docker-data/uploads:/app/uploads
      - ./docker-data/outputs:/app/outputs
    expose:
      - "8000"

  frontend:
    image: ghcr.io/ycf-76/pulsestudio-frontend:latest
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
