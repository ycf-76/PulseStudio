<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开发模式登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 48px;
      width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 { text-align: center; margin-bottom: 8px; font-size: 22px; font-weight: 600; }
    .subtitle { text-align: center; color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #4a9eff; }
    input::placeholder { color: rgba(255,255,255,0.3); }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4a9eff 0%, #6c5ce7 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
    }
    #status.ok { display: block; background: rgba(46,213,115,0.12); border: 1px solid rgba(46,213,115,0.25); color: #2ed573; }
    #status.err { display: block; background: rgba(255,71,87,0.12); border: 1px solid rgba(255,71,87,0.25); color: #ff4757; }
    #status.info { display: block; background: rgba(74,158,255,0.12); border: 1px solid rgba(74,158,255,0.25); color: #4a9eff; }
    pre { white-space: pre-wrap; word-break: break-all; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; margin-top: 8px; }
    .avatar-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .avatar-preview img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .avatar-info { font-size: 13px; }
    .avatar-info strong { display: block; color: #fff; margin-bottom: 2px; }
    .avatar-info span { color: rgba(255,255,255,0.5); font-size: 11px; word-break: break-all; }
    .quick-accounts { margin-bottom: 18px; }
    .quick-accounts label { margin-bottom: 8px; }
    .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .quick-btns button {
      width: auto;
      padding: 6px 14px;
      font-size: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .quick-btns button:hover { background: rgba(255,255,255,0.15); }
    .warning {
      text-align: center;
      font-size: 11px;
      color: rgba(255,193,7,0.7);
      margin-top: 16px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🔑 开发模式登录</h1>
  <p class="subtitle">跳过验证码 · 一键获取 Token</p>

  <div class="form-group quick-accounts">
    <label>快速选择账号</label>
    <div class="quick-btns" id="quickBtns"></div>
  </div>

  <div class="form-group">
    <label for="email">邮箱</label>
    <input type="email" id="email" value="1693241521@qq.com" placeholder="输入邮箱地址">
  </div>

  <button id="loginBtn" onclick="doLogin()">立即登录</button>

  <div id="status"></div>

  <p class="warning">⚠️ 仅限 dev 环境使用，生产环境返回 403</p>
</div>

<script>
const accounts = [
  '1693241521@qq.com',
  'test@test.com',
  'smoke@test.com',
];

const quickBtns = document.getElementById('quickBtns');
accounts.forEach(email => {
  const btn = document.createElement('button');
  btn.textContent = email.split('@')[0];
  btn.onclick = () => { document.getElementById('email').value = email; };
  quickBtns.appendChild(btn);
});

async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const status = document.getElementById('status');
  const email = document.getElementById('email').value.trim();

  if (!email || !email.includes('@')) {
    showStatus('err', '请输入有效邮箱地址');
    return;
  }

  btn.disabled = true;
  btn.textContent = '登录中...';
  showStatus('info', '正在请求 /api/auth/dev-login ...');

  try {
    const resp = await fetch('/api/auth/dev-login?email=' + encodeURIComponent(email), { method: 'POST' });
    const data = await resp.json();

    if (data.success) {
      localStorage.setItem('token', data.data.token);
      localStorage.setItem('refresh_token', data.data.refresh_token);
      localStorage.setItem('mint_user_info', JSON.stringify({
        user_id: data.data.user_id,
        nickname: data.data.nickname,
        avatar_url: data.data.avatar_url,
        has_xhs_auth: data.data.has_xhs_auth || false,
        login_method: data.data.login_method || 'email',
      }));

      let html = '<strong>✅ 登录成功！</strong>';
      html += '<pre>' + JSON.stringify({
        user_id: data.data.user_id,
        nickname: data.data.nickname,
        login_method: data.data.login_method,
        token_prefix: data.data.token.substring(0, 30) + '...'
      }, null, 2) + '</pre>';

      if (data.data.avatar_url && !data.data.avatar_url.startsWith('/images/')) {
        html += '<div class="avatar-preview">';
        html += '<img src="' + data.data.avatar_url + '" alt="avatar">';
        html += '<div class="avatar-info"><strong>' + data.data.nickname + '</strong><span>' + data.data.avatar_url + '</span></div>';
        html += '</div>';
      }

      html += '<br><em style="color:rgba(255,255,255,0.5)">3秒后自动跳转到首页...</em>';
      showStatus('ok', html);

      setTimeout(() => { location.href = '/'; }, 3000);
    } else {
      showStatus('err', '<strong>❌ 登录失败</strong><pre>' + JSON.stringify(data, null, 2) + '</pre>');
    }
  } catch (e) {
    showStatus('err', '<strong>❌ 请求错误</strong><pre>' + e.message + '</pre>');
  }

  btn.disabled = false;
  btn.textContent = '立即登录';
}

function showStatus(type, html) {
  const el = document.getElementById('status');
  el.className = type;
  el.innerHTML = html;
}

document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
